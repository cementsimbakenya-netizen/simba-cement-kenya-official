name: Update business email
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace website email
        run: |
          find . -type f -name '*.html' -print0 | xargs -0 sed -i 's/cementsimbakenya@gmail.com/info@simbakenyacement.com/g'
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Update website contact email'
          git push
